[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tropeiro-intel"
version = "4.6.0"
description = "Defensive phishing campaign OSINT, attribution and actionable intelligence for Google Colab and Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Tropeiro Intel contributors"}]
dependencies = ["tldextract", "rapidfuzz", "pandas", "networkx", "stix2"]

[project.scripts]
tropeiro = "tropeiro.cli:main"

[project.optional-dependencies]
colab = ["dnstwist", "ipywidgets", "gradio>=4.44,<6"]
colab-full = ["dnstwist[full]", "ipywidgets", "gradio>=4.44,<6"]
ai = ["gliner", "transformers>=4.51.0", "accelerate>=1.0"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tropeiro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
