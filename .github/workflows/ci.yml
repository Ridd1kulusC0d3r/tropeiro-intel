name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  colab-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[colab]"
      - name: Import full backend
        run: |
          python - <<'PY'
          import json
          import tropeiro
          from tropeiro.similarity import compare_domains
          from tropeiro.correlation.advanced import source_independence
          from tropeiro.intelligence import build_ioc_decisions
          from tropeiro.reporting.rich_html import build_report
          from tropeiro.reporting.context import build_report_data, build_feature_matrix, report_preflight
          from tropeiro.ai import build_evidence_packet, validate_ai_analysis, attach_ai_overlay
          from tropeiro.frontend.app import relationship_rows, _normalize_target
          from tropeiro.memory import CaseMemory
          from pathlib import Path
          import tempfile
          with tempfile.TemporaryDirectory() as td:
              ns={"CASE_ID":"CI-SPARSE","WORKSPACE":Path(td),"ENABLE_DNS":True}
              data=build_report_data(ns,version=tropeiro.__version__)
              assert data["meta"]["partial_report"] is True
              p=build_report(data,Path(td)/"report.html")
              assert p.exists()
              packet=build_evidence_packet(data)
              ai=validate_ai_analysis({"key_findings":[]},packet)
              over=attach_ai_overlay(data,analysis=ai,packet=packet)
              assert over["evidence_ledger"]==data["evidence_ledger"]
          kind,iocs=_normalize_target("example.com","AUTO")
          assert kind=="DOMAIN" and "example.com" in iocs["domain"]
          assert relationship_rows({"example.com":{"dns":{"A":["1.2.3.4"]},"rdap":{},"cert_names":[]}})
          with tempfile.TemporaryDirectory() as md:
              mem=CaseMemory(Path(md)/"memory.sqlite")
              data["meta"]["case_id"]="MEM-1"
              mem.store_case(data)
              assert mem.stats()["cases"]==1
          print(json.dumps({"version": tropeiro.__version__, "import": "ok", "report_sparse": "ok", "frontend": "ok", "campaign_memory": "ok"}))
          PY
      - name: Validate guided widget runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("notebooks/Tropeiro_Intel_Official_Colab.ipynb")
          nb=json.loads(p.read_text())
          ns={}
          wanted=("04) COLE AQUI O ALVO DA PESQUISA","05) Plano de scans: automático ou manual")
          for title in wanted:
              cell=next(c for c in nb["cells"] if c["cell_type"]=="code" and title in "".join(c.get("source",[])))
              exec(compile("".join(cell["source"]),"<colab-widget-smoke>","exec"),ns,ns)
          print("guided widget runtime: ok")
          PY
      - name: Validate official notebook bootstrap
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p=Path("notebooks/Tropeiro_Intel_Official_Colab.ipynb")
          nb=json.loads(p.read_text())
          assert len(nb["cells"]) >= 60
          code=[c for c in nb["cells"] if c["cell_type"]=="code"]
          for c in code:
              s="".join(c.get("source",[]))
              ast.parse("\n".join(x for x in s.splitlines() if not x.lstrip().startswith(("%","!"))))
          first="".join(code[0]["source"])
          assert "ensure_tropeiro" in first
          assert "sys.path.insert" in first
          print("official notebook bootstrap: ok")
          PY
